[package]
name = "route-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
futures = "0.3.33"
hdrhistogram = "7.6.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
yellowstone-grpc-client = "13.2.1"
yellowstone-grpc-proto = "12.5.0"
